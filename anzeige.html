<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hallenanzeige · Parler Oberstufen-Turnier</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060D">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/site.css">
<style>
html,body{height:100%;overflow:hidden}
body{background:var(--noise),radial-gradient(70% 90% at 50% 0%,rgba(46,107,255,.42),transparent 65%),#05091A;cursor:none}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:2.2vh 3vw;gap:1.5vh}
.hx-top{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.hx-top .l{display:flex;align-items:center;gap:1.4vw}
.hx-top .logo-school{width:6vh}.hx-top .logo-smv{height:6vh}
.hx-top .t{font-family:var(--f-d);font-style:italic;font-weight:900;text-transform:uppercase;font-size:4.2vh;line-height:1}
.hx-top .t span{color:var(--cyan)}
.hx-top .r{font-family:var(--f-d);font-style:italic;font-weight:800;text-transform:uppercase;font-size:3.6vh;color:var(--muted);text-align:right;line-height:1.1}
.hx-top .r b{color:#fff}
.hx-mid{display:grid;grid-template-rows:1fr auto auto;align-content:center;gap:2vh;min-height:0}
.hx-sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3vw}
.hx-team{display:grid;justify-items:center;gap:2vh;text-align:center;min-width:0}
.hx-team .mono{width:18vh;height:18vh;font-size:7vh;box-shadow:inset 0 0 0 .6vh rgba(255,255,255,.3)}
.hx-team b{font-family:var(--f-d);font-style:italic;font-weight:900;text-transform:uppercase;font-size:8.5vh;line-height:.95;overflow-wrap:break-word;max-width:100%}
.hx-team .bar2{width:60%;height:1vh;background:var(--c)}
.hx-score{font-family:var(--f-d);font-style:italic;font-weight:900;font-size:34vh;line-height:.8;display:flex;gap:1.5vw;align-items:center;font-variant-numeric:tabular-nums;text-shadow:0 0 6vh rgba(92,194,255,.5)}
.hx-score i{color:var(--cyan);font-size:.5em}
.hx-score .vs{font-size:.4em;color:var(--muted)}
.hx-clock{display:flex;justify-content:center;align-items:baseline;gap:2vw}
.hx-clock .clk{font-size:16vh;line-height:1;color:#fff}
.hx-clock .clk.over{color:var(--yellow)}
.hx-clock .cstate{font-size:2.6vh}
.hx-mid .bar{height:1.2vh}
.hx-ev{display:grid;grid-template-columns:1fr 1fr;gap:3vw;font-size:3vh;font-weight:600;min-height:4vh}
.hx-ev div{display:flex;flex-wrap:wrap;gap:.6vh 2vw;align-content:flex-start}
.hx-ev div+div{justify-content:flex-end}
.hx-ev span{display:inline-flex;gap:.8vw;align-items:center}
.hx-ev .mi{font-family:var(--f-d);font-style:italic;font-weight:800;color:var(--cyan)}
.hx-ev .ic{width:2vh;height:2vh}
.hx-bot{display:flex;justify-content:space-between;align-items:center;gap:2vw;font-family:var(--f-d);font-style:italic;font-weight:800;text-transform:uppercase;font-size:3.4vh;color:var(--muted);border-top:1px solid var(--line);padding-top:1.4vh}
.hx-bot b{color:#fff}
.hx-bench{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;padding:1.2vh 1.6vw;background:rgba(46,107,255,.12);border:1px solid var(--line);font-family:var(--f-d);font-style:italic;text-transform:uppercase}
.hx-bench small{display:block;font-weight:700;font-size:2.1vh;letter-spacing:.12em;color:var(--muted)}
.hx-bench .c{text-align:center}.hx-bench .c b{font-weight:800;font-size:3vh;color:var(--cyan)}
.hx-bench .r{text-align:right}.hx-bench .r .bt{flex-direction:row-reverse}
.hx-bench .bt{display:flex;align-items:center;gap:1vw;margin-top:.4vh;min-width:0}
.hx-bench .bt b{font-weight:900;font-size:3.6vh;color:#fff;border-bottom:.5vh solid var(--c);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-bench .bt .mono{width:4.6vh;height:4.6vh;flex:none;font-size:1.8vh}
.hx-bot .sp{display:flex;gap:3vw;align-items:center;overflow:hidden;white-space:nowrap}
.hx-bot .sp img{height:5vh;filter:brightness(0) invert(1);opacity:.9}
.flash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(46,107,255,.92),rgba(5,9,26,.96) 70%);z-index:10;animation:fl 4.5s ease forwards;pointer-events:none}
.flash div{text-align:center;font-family:var(--f-d);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.9}
.flash .big{font-size:38vh;color:#fff;text-shadow:0 0 8vh rgba(92,194,255,.8)}
.flash .who{font-size:9vh;color:var(--cyan)}
.flash .tm{font-size:6vh;color:#fff;margin-top:1vh}
@keyframes fl{0%{opacity:0;transform:scale(1.15)}8%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.hx-pens .pen{font-size:3.2vh;padding:.6vh 1.4vw;gap:1vw}.hx-pens .pen b{font-size:2.4vh}.hx-pens .pen em{font-size:4vh}
.start{position:fixed;inset:auto 2vw 2vh auto;z-index:20;cursor:pointer;background:var(--blue);border:0;color:#fff;font-weight:700;padding:10px 16px;border-radius:5px}
body.fs .start{display:none}
.idle-t{font-family:var(--f-d);font-style:italic;font-weight:900;text-transform:uppercase;font-size:6vh;color:var(--cyan);text-align:center}
</style>
</head>
<body>
<div id="app"><div class="hx-mid" style="color:#A3B3DA;font-size:3vh">Anzeige wird geladen …</div></div>
<button class="start" id="fsbtn" type="button">Vollbild (Taste F)</button>
<script src="/js/core.js"></script>
<script src="/js/anzeige.js"></script>
</body>
</html>
